name: dotnet-project

on:
  push:
    branches:
      - develop

jobs:
  build_the_binary:
    name: Building the Binary
    runs-on: self-hosted

    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
      DOTNET_ROOT: ${{ runner.temp }}/.dotnet
      PATH: ${{ runner.temp }}/.dotnet:${{ runner.temp }}/.dotnet/tools:${{ env.PATH }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Verify dotnet
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore src/Presentation/Nop.Web/Nop.Web.csproj

      - name: Build the project
        run: dotnet build src/Presentation/Nop.Web/Nop.Web.csproj -c Release --no-restore

      - name: Publish the project
        run: dotnet publish src/Presentation/Nop.Web/Nop.Web.csproj -c Release -o demo

      - name: Copy Themes folder
        if: always()
        run: |
          mkdir -p demo/Themes
          if [ -d "src/Presentation/Nop.Web/Themes" ]; then
            cp -r src/Presentation/Nop.Web/Themes/* demo/Themes/
          fi

      - name: Run the application
        working-directory: demo
        run: dotnet Nop.Web.dll

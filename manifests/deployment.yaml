apiVersion: apps/v1
kind: Deployment
metadata:
  name: css-dep
  labels:
    env: prod
    app: web
spec:
  minReadySeconds: 6
  replicas: 2
  selector:
    matchLabels:
      app: dotnet-nop
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: dotnet-nop
      name: nop-pod
    spec:
      containers:
        - name: dotnet-con
          image: 168034219757.dkr.ecr.ap-south-1.amazonaws.com/dev/nop:latest 
          ports:
            - containerPort: 5000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
          livenessProbe:
            httpGet:
              path: /
              port: 5000
          resources:
            requests:
              cpu: "800m" 
              memory: "1500Mi"  
            limits:
              cpu: "1800m"        
              memory: "1800Mi" 